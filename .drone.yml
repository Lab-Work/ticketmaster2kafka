kind: pipeline
type: kubernetes
name: build-and-deploy

platform:
  os: linux
  arch: amd64

# Build + deploy from the default branch only: feature-branch pushes and PRs
# must not push images or bump the k8s manifest.
trigger:
  branch:
    - main
  event:
    - push

steps:
  - name: build-image
    # Pinned: plugins/docker:latest ships Docker 20.10 built against iptables-legacy,
    # whose nat table does not exist on Talos nodes, so its embedded dockerd never starts.
    image: plugins/docker:21.3.4
    settings:
      repo: docker.mogi.io/ticketmaster2kafka
      platform: linux/amd64
      tags:
        - ${DRONE_COMMIT_SHA}
      registry: docker.mogi.io
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      # The lv_* connectors are private; the Dockerfile's builder stage
      # installs them with this token (it never reaches the pushed image).
      build_args_from_env:
        - GITHUB_TOKEN
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_PUSH_TOKEN

  - name: update-k8s-manifests
    image: alpine/git
    environment:
      GIT_AUTHOR_NAME: "blegas78"
      GIT_AUTHOR_EMAIL: "12centdwarf@gmail.com"
      GITHUB_PUSH_TOKEN:
        from_secret: GITHUB_PUSH_TOKEN
    commands:
      - apk add --no-cache curl
      - curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/bin/yq
      - chmod +x /usr/bin/yq
      - git config --global user.name $GIT_AUTHOR_NAME
      - git config --global user.email $GIT_AUTHOR_EMAIL
      - git clone https://$GITHUB_PUSH_TOKEN@github.com/blegas78/k8s-manifests-backend.git
      - cd k8s-manifests-backend
      - yq eval '.spec.template.spec.containers[0].image = "docker.mogi.io/ticketmaster2kafka:${DRONE_COMMIT_SHA}"' -i 2kafka/ticketmaster/deployment.yaml
      - git commit -am "Update image to ${DRONE_COMMIT_SHA}"
      - git push https://$GITHUB_PUSH_TOKEN@github.com/blegas78/k8s-manifests-backend.git HEAD:main
